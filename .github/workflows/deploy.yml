name: Deploy Quartz a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan varios pushes seguidos, deja terminar el despliegue en curso
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # npm reciente bloquea dependencias desde git; Quartz v5 las usa
  npm_config_allow_git: all

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quartz
    steps:
      - name: Checkout (historial completo para las fechas de git)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: quartz/.node-version
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Usar HTTPS para dependencias de GitHub (no hay llave SSH en CI)
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar plugins (solo Quartz v5)
        run: |
          if [ -f quartz.lock.json ]; then
            npx quartz plugin install
          fi

      - name: Construir el sitio
        run: npx quartz build -d ../content

      - name: Subir artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4